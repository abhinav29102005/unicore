unicore:
  origin: ${UNICORE_ORIGIN:https://sites.abhinavkumarsingh.tech,https://unicore-frontend.pages.dev}
  sample-data: false

server:
  port: 8080

spring:
  application:
    name: unicore-backend
  profiles:
    active: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/unicore?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:unicore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: jdbc:h2:file:${UNICORE_DATA_DIR}/unicore;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: unicore
    password: ${UNICORE_DB_PASSWORD}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
server:
  address: 127.0.0.1
  port: ${PORT:9103}
  servlet:
    context-path: /unicore
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: __Host-unicore
        path: /
        secure: true
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
unicore:
  origin: ${UNICORE_ORIGIN:https://sites.abhinavkumarsingh.tech,https://unicore-frontend.pages.dev}
  data-dir: ${UNICORE_DATA_DIR:./data}
  bootstrap-email: ${UNICORE_ADMIN_EMAIL:}
  sample-data: ${UNICORE_SAMPLE_DATA:false}
