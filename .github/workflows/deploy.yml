name: Deploy UniCore Documentation Hub to GitHub Pages

on:
  push:
    branches: ["main"]

  # Allows manual workflow trigger from GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Root Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install & Build Web Documentation Site
        run: |
          cd docs/website
          npm install
          npm run build

      - name: Merge Documentation into Root Build
        run: |
          mkdir -p frontend/dist/docs
          cp -r docs/website/dist/* frontend/dist/docs/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
